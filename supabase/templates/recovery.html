<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f8fc;color:#172033;font-family:Arial,sans-serif;">
    <main style="max-width:560px;margin:0 auto;padding:40px;background:#ffffff;border-radius:16px;">
      <p style="margin:0 0 20px;color:#2563eb;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Bespoke task management</p>
      <h1 style="margin:0 0 16px;font-size:28px;line-height:1.15;">Reset your password.</h1>
      <p style="margin:0 0 24px;line-height:1.6;">Use this one-time link to choose a new password for your work account.</p>
      <p style="margin:0 0 28px;"><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:13px 20px;border-radius:9px;background:#2563eb;color:#ffffff;font-weight:700;text-decoration:none;">Reset password</a></p>
      <p style="margin:0;color:#64748b;font-size:13px;line-height:1.55;">This link expires after one hour and can only be used once. If you did not request a password reset, you can safely ignore this email.</p>
    </main>
  </body>
</html>
