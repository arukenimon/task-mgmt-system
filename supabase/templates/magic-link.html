<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Bespoke</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f6f8fc;color:#172033;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #d9e2ef;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:32px 36px;background:#17233b;color:#ffffff;">
                <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#a9bdd9;">Bespoke task management</p>
                <h1 style="margin:0;font-size:28px;line-height:1.2;">Your secure sign-in link</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:36px;">
                <p style="margin:0 0 20px;font-size:16px;line-height:1.55;">Use this one-time link to access the workspaces and client data your role permits.</p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:13px 20px;border-radius:9px;background:#2563eb;color:#ffffff;font-size:15px;font-weight:700;line-height:1;text-decoration:none;">Sign in to Bespoke</a>
                </p>
                <p style="margin:0;color:#64748b;font-size:13px;line-height:1.55;">This link expires in one hour and can be used once. If you did not request it, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
